    const playThomasSfx = (type, enabled) => {
      if (!enabled || typeof window === 'undefined') return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'send') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.14);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.start(now);
          osc.stop(now + 0.16);
        } else if (type === 'receive') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          osc.frequency.setValueAtTime(1046.5, now + 0.16);
          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.34);
          osc.start(now);
          osc.stop(now + 0.34);
        } else if (type === 'activate') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(760, now + 0.22);
          gain.gain.setValueAtTime(0.07, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.start(now);
          osc.stop(now + 0.24);
        } else if (type === 'micStart') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.start(now);
          osc.stop(now + 0.14);
        } else if (type === 'micStop') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(660, now);
          osc.frequency.exponentialRampToValueAtTime(380, now + 0.12);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.start(now);

      const sectionRef = useRef(null);
      const [scrollState, setScrollState] = useState({ offset: 0, velocity: 0 });
      const lastScrollY = useRef(0);

      const row1Images = useMemo(() => {
        const first11 = MARQUEE_IMAGES.slice(0, 11);
        return [...first11, ...first11, ...first11];
      }, []);

      const row2Images = useMemo(() => {
        const remaining10 = MARQUEE_IMAGES.slice(11);
        return [...remaining10, ...remaining10, ...remaining10];
      }, []);

      useEffect(() => {
        let rafId = null;
        const updateOffset = () => {
          const el = sectionRef.current;
          if (el) {
            const rect = el.getBoundingClientRect();
            const sectionTop = rect.top + window.scrollY;
            const currentY = window.scrollY;
            const rawDelta = currentY - lastScrollY.current;
            lastScrollY.current = currentY;
            const clampedVelocity = Math.max(-25, Math.min(25, rawDelta));
            const computedOffset = (currentY - sectionTop + window.innerHeight) * 0.45;
            setScrollState({ offset: computedOffset, velocity: clampedVelocity });
          }
          rafId = null;
        };
        const handleScroll = () => {
          if (rafId === null) rafId = window.requestAnimationFrame(updateOffset);
        };
        updateOffset();
        window.addEventListener('scroll', handleScroll, { passive: true });
        window.addEventListener('resize', handleScroll, { passive: true });
        return () => {
          window.removeEventListener('scroll', handleScroll);
          window.removeEventListener('resize', handleScroll);
          if (rafId !== null) window.cancelAnimationFrame(rafId);
        };
      }, []);

      const { offset, velocity } = scrollState;
      const tiltZ = Math.sin(offset * 0.004) * 2.6 + velocity * 0.08;
      const perspectiveRotateX = -10 + Math.cos(offset * 0.008) * 6;
      const perspectiveRotateY = Math.sin(offset * 0.006) * 7;

      return (
        <section
          ref={sectionRef}
          aria-label="Motion Showcase Marquee"
          className="relative w-full bg-[#0C0C0C] pt-24 sm:pt-32 md:pt-40 pb-24 overflow-hidden"
          style={{ perspective: '1400px' }}
        >
          <div
            aria-hidden="true"

            style={{
              background:
                'radial-gradient(circle, rgba(56,189,248,0.38) 0%, rgba(182,0,168,0.42) 50%, transparent 75%)',
            }}
          />

          <div
            className="relative z-10 flex flex-col gap-7 w-full transition-transform duration-200 ease-out"
            style={{
              transform: `rotateX(${perspectiveRotateX}deg) rotateY(${perspectiveRotateY}deg) rotateZ(${tiltZ}deg)`,
              transformStyle: 'preserve-3d',
            }}
          >
            {/* Row 1: Data & Security */}
            <div
              className="flex flex-row gap-6 w-max"
              style={{
                transform: `translate3d(${-(offset * 1.15 - 120)}px, ${Math.sin(offset * 0.015) * 18}px, 36px)`,
                willChange: 'transform',
              }}
            >
              {row1Images.map((item, idx) => (
                <div
                  key={`r1-${idx}`}
                  className="relative w-[420px] h-[270px] shrink-0 rounded-3xl overflow-hidden bg-[#14141A] border border-[#D7E2EA]/25 hover:border-sky-400 shadow-[0_24px_60px_rgba(0,0,0,0.88)] transition-all duration-300 hover:-translate-y-3 hover:scale-105 group"
                >
                  <img src={item.url} alt={item.label} loading="lazy" className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" />
                  <div className="absolute inset-0 bg-gradient-to-t from-black/85 via-black/15 to-transparent opacity-85" />
                  <span className="absolute bottom-4 left-4 text-[11px] font-semibold uppercase tracking-widest text-[#D7E2EA] bg-black/65 backdrop-blur-md border border-[#D7E2EA]/25 px-3.5 py-1.5 rounded-full">
                    {item.label}
                  </span>
                </div>
              ))}
            </div>

            {/* Row 2: 3D & Cyber Systems */}
            <div
              className="flex flex-row gap-6 w-max -ml-[2600px]"
              style={{
                transform: `translate3d(${offset * 1.15 - 120}px, ${-Math.sin(offset * 0.015) * 18}px, -24px)`,
                willChange: 'transform',
              }}
            >
              {row2Images.map((item, idx) => (
                <div
                  key={`r2-${idx}`}
                  className="relative w-[420px] h-[270px] shrink-0 rounded-3xl overflow-hidden bg-[#14141A] border border-[#D7E2EA]/25 hover:border-[#B600A8] shadow-[0_24px_60px_rgba(0,0,0,0.88)] transition-all duration-300 hover:-translate-y-3 hover:scale-105 group"

                  <div className="absolute inset-0 bg-gradient-to-t from-black/85 via-black/15 to-transparent opacity-85" />

                    {item.label}
                  </span>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    };

              <img
                src="https://shrug-person-78902957.figma.site/_components/v2/d24c01ad3a56fc65e942a1f501eb73db42d7cf9a/Rectangle_40443.81459862.png"
                alt="THOMAS"
                className="w-full h-full object-cover object-top scale-125"
              />
              <span className="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-emerald-400 ring-2 ring-[#0C0C0C]" />
            </div>
            <div className="text-left pr-1">
              <span className="block text-xs font-bold uppercase tracking-widest text-white leading-none">THOMAS</span>
              <span className="block text-[10px] text-[#BBCCD7]/75 tracking-wider mt-0.5">
                {isOpen ? 'Close Chat' : 'AI Assistant'}
              </span>
            </div>
          </button>

          {isOpen && (
            <aside className="fixed bottom-20 right-4 sm:right-5 z-50 w-[calc(100vw-2rem)] sm:w-[390px] rounded-[30px] border-2 border-[#D7E2EA]/40 bg-[#0C0C0C]/95 backdrop-blur-2xl text-[#D7E2EA] shadow-[0_25px_80px_rgba(0,0,0,0.9)] overflow-hidden flex flex-col">
              <div
                className="flex items-center justify-between px-5 py-4 border-b border-[#D7E2EA]/15"
                style={{ background: 'linear-gradient(123deg, rgba(24,1,31,0.95) 0%, rgba(182,0,168,0.28) 55%, rgba(118,33,176,0.35) 100%)' }}
              >
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-full overflow-hidden border-2 border-[#D7E2EA]/60">
                    <img
                      src="https://shrug-person-78902957.figma.site/_components/v2/d24c01ad3a56fc65e942a1f501eb73db42d7cf9a/Rectangle_40443.81459862.png"
                      alt="THOMAS"
                      className="w-full h-full object-cover object-top scale-125"
                    />
                  </div>
                  <div>
                    <h4 className="text-sm font-bold uppercase tracking-widest text-white">THOMAS</h4>
                    <p className="text-[11px] text-[#D7E2EA]/70">Md Arman Ansari&apos;s AI</p>
                  </div>
                </div>
                <div className="flex items-center gap-1.5">
                  <button
                    type="button"
                    onClick={onToggleVoice}
                    className={`w-8 h-8 rounded-full border flex items-center justify-center cursor-pointer text-xs ${
                      voiceEnabled ? 'border-sky-400/50 bg-sky-500/20 text-sky-300' : 'border-[#D7E2EA]/25 text-[#D7E2EA]/50'
                    }`}
                  >
                    {voiceEnabled ? '🔊' : '🔇'}
                  </button>
                  <button
                    type="button"
                    onClick={onToggle}
                    className="w-8 h-8 rounded-full border border-[#D7E2EA]/25 flex items-center justify-center text-[#D7E2EA] hover:bg-white/10 cursor-pointer"
                  >
                    &#10005;
                  </button>
                </div>
              </div>

              <div className="flex flex-col gap-3 p-4 max-h-[300px] overflow-y-auto">
                {messages.map((msg) => (
                  <div key={msg.id} className={`flex flex-col max-w-[85%] ${msg.role === 'user' ? 'self-end items-end' : 'self-start items-start'}`}>
                    <span className="text-[10px] uppercase tracking-widest text-[#D7E2EA]/45 mb-1 px-1">
                      {msg.role === 'user' ? 'You' : 'THOMAS'}
                    </span>
                    <div
                      className={`rounded-2xl px-4 py-2.5 text-xs sm:text-sm leading-relaxed ${
                        msg.role === 'user'
                          ? 'bg-gradient-to-r from-[#B600A8] to-[#7621B0] text-white rounded-br-sm'
                          : 'bg-white/[0.06] border border-[#D7E2EA]/15 text-[#D7E2EA] rounded-bl-sm'
                      }`}
                    >
                      {msg.text}
                    </div>
                  </div>
                ))}
                {isTyping && (
                  <div className="self-start rounded-2xl bg-white/[0.06] border border-[#D7E2EA]/15 px-4 py-2.5 text-xs text-sky-300">
                    THOMAS is thinking...
                  </div>
                )}
                <div ref={endRef} />
              </div>

              <form onSubmit={handleSubmit} className="flex items-center gap-2 p-3 border-t border-[#D7E2EA]/15 bg-black/40">
                <button
                  type="button"
                  onClick={onToggleMic}
                  className={`w-9 h-9 rounded-full border flex items-center justify-center shrink-0 cursor-pointer text-xs ${
                    isListening ? 'border-rose-400 bg-rose-500/30 text-rose-200 animate-pulse' : 'border-[#D7E2EA]/25 text-[#D7E2EA]'
                  }`}
                >
                  {isListening ? '⏹' : '🎤'}
                </button>
                <input
                  type="text"
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  placeholder="Ask THOMAS anything..."
                  className="flex-1 rounded-full border border-[#D7E2EA]/20 bg-white/[0.04] px-4 py-2 text-xs sm:text-sm text-white placeholder:text-[#D7E2EA]/40 focus:outline-none focus:border-[#D7E2EA]"
                />
                <button
                  type="button"
                  onClick={() => { onToggle(); onOpenContact(); }}
                  className="w-9 h-9 rounded-full border border-[#D7E2EA]/25 flex items-center justify-center text-[#D7E2EA] hover:bg-white/10 shrink-0 cursor-pointer text-xs"
                >
                  &#9993;
                </button>
                <button
                  type="submit"
                  disabled={!input.trim() || isTyping}
                  className="w-9 h-9 rounded-full bg-gradient-to-r from-[#B600A8] to-[#7621B0] flex items-center justify-center text-white disabled:opacity-40 shrink-0 cursor-pointer text-xs"
                >
                  &#10148;
                </button>
              </form>
            </aside>
          )}
        </>
      );
    };

    // ========================================================================
    // MAIN APPLICATION
    // ========================================================================
    function App() {
      const [isContactOpen, setIsContactOpen] = useState(false);
      const [isThomasOpen, setIsThomasOpen] = useState(false);
      const [showGreeting, setShowGreeting] = useState(true);
      const [selectedProject, setSelectedProject] = useState(null);
      const [voiceEnabled, setVoiceEnabled] = useState(true);
      const [isThomasSpeaking, setIsThomasSpeaking] = useState(false);
      const [isThomasTyping, setIsThomasTyping] = useState(false);
      const [isListening, setIsListening] = useState(false);
      const recognitionRef = useRef(null);
      const [messages, setMessages] = useState([
        {
          id: 'w1',
          role: 'thomas',
          text: "Hey! 👋 I'm THOMAS, Md Arman Ansari's AI assistant. Ask me anything about Arman's 3D & Cyber Security portfolio, projects, services, or contact details!",
        },
      ]);

      const speakResponse = (text) => {
        if (!voiceEnabled || !('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel();
          const clean = text.replace(/[\u{1F300}-\u{1FAFF}]/gu, '');
          const utter = new SpeechSynthesisUtterance(clean);
          utter.rate = 1.03;
          utter.onstart = () => setIsThomasSpeaking(true);
          utter.onend = () => setIsThomasSpeaking(false);
          utter.onerror = () => setIsThomasSpeaking(false);
          window.speechSynthesis.speak(utter);
        } catch (e) {
          setIsThomasSpeaking(false);
        }
      };

      const generateReply = (query) => {
        const q = query.toLowerCase();
        if (q.includes('who') || q.includes('arman') || q.includes('about') || q.includes('college')) {
          return 'Md Arman Ansari is a 3D Visual Artist and 1st-year BCA in Data and Cyber Security student at Inspiria Knowledge Campus in Siliguri, West Bengal, India.';
        }
        if (q.includes('project') || q.includes('cyber') || q.includes('data') || q.includes('security')) {
          return 'Arman has built 3 flagship projects: 01. CyberShield Threat Matrix (3D SOC defense), 02. DataVault Analytics Core (encrypted big-data telemetry), and 03. ZeroTrust Protocol 3D (cryptographic node simulation).';
        }
        if (q.includes('service') || q.includes('3d') || q.includes('price') || q.includes('offer')) {
          return 'Arman offers 5 services: 01. 3D Modeling, 02. Rendering, 03. Motion Design, 04. Branding, and 05. Modern Web Design.';
        }
        if (q.includes('contact') || q.includes('email') || q.includes('hire') || q.includes('github') || q.includes('linkedin')) {
          return `You can email Arman directly at ${CREATOR_EMAIL}, view his repositories at github.com/armannansarii-tech, or connect on LinkedIn (linkedin.com/in/arman-ansari-84471b451)!`;
        }
        return `Great question! I'm THOMAS, Arman's AI guide. You can ask me about Arman's education at Inspiria Knowledge Campus, his 3D & Cyber Security projects, services, or reach him directly at ${CREATOR_EMAIL}.`;
      };

      const handleAskThomas = (text) => {
        const trimmed = text.trim();
        if (!trimmed) return;
        playThomasSfx('send', voiceEnabled);
        setShowGreeting(true);
        setMessages((prev) => [...prev, { id: `u-${Date.now()}`, role: 'user', text: trimmed }]);
        setIsThomasTyping(true);

        setTimeout(() => {
          const reply = generateReply(trimmed);
          playThomasSfx('receive', voiceEnabled);
          setMessages((prev) => [...prev, { id: `t-${Date.now()}`, role: 'thomas', text: reply }]);
          setIsThomasTyping(false);
          speakResponse(reply);
        }, 450);
      };

      const handleToggleMic = () => {
        if (isListening) {
          recognitionRef.current?.stop();
          setIsListening(false);
          playThomasSfx('micStop', voiceEnabled);
          return;
        }
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          handleAskThomas('Tell me about Arman');
          return;
        }
        const rec = new SR();
        rec.lang = 'en-US';
        rec.onstart = () => { setIsListening(true); playThomasSfx('micStart', voiceEnabled); };
        rec.onresult = (e) => {
          const transcript = e?.results?.[0]?.[0]?.transcript;
          if (transcript) handleAskThomas(transcript);
        };
        rec.onerror = () => setIsListening(false);
        rec.onend = () => setIsListening(false);
        recognitionRef.current = rec;
        rec.start();
      };

      const latestReply = [...messages].reverse().find((m) => m.role === 'thomas')?.text || '';

      return (
        <div className="min-h-screen w-full bg-[#0C0C0C] text-[#D7E2EA]">
          <main className="w-full">
            <HeroSection
              onOpenContact={() => setIsContactOpen(true)}
              onOpenThomas={() => { playThomasSfx('activate', voiceEnabled); setIsThomasOpen(true); }}
              showGreeting={showGreeting}
              onDismissGreeting={() => setShowGreeting(false)}
              latestThomasReply={latestReply}
              isThomasSpeaking={isThomasSpeaking}
              isThomasTyping={isThomasTyping}
              isListening={isListening}
              onToggleMic={handleToggleMic}
              onAskThomasDirect={handleAskThomas}
            />
            <MarqueeSection />
            <AboutSection onOpenContact={() => setIsContactOpen(true)} />
            <ServicesSection />
            <ProjectsSection onSelectProject={(p) => setSelectedProject(p)} />
          </main>

          <ThomasAssistant
            isOpen={isThomasOpen}
            onToggle={() => { playThomasSfx('activate', voiceEnabled); setIsThomasOpen((p) => !p); }}
            onOpenContact={() => setIsContactOpen(true)}
            messages={messages}
            isTyping={isThomasTyping}
            isListening={isListening}
            onToggleMic={handleToggleMic}
            onSendMessage={handleAskThomas}
            voiceEnabled={voiceEnabled}
            onToggleVoice={() => {
              setVoiceEnabled((prev) => {
                if (prev && 'speechSynthesis' in window) {
                  window.speechSynthesis.cancel();
                  setIsThomasSpeaking(false);
                }
                return !prev;
              });
            }}
          />

          <ContactModal isOpen={isContactOpen} onClose={() => setIsContactOpen(false)} />
          <ProjectModal
            project={selectedProject}
            onClose={() => setSelectedProject(null)}
            onInquire={() => setIsContactOpen(true)}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
